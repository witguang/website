# 手动配置用。如果你用 deploy/setup-vps.sh，这份文件不需要——脚本会自己生成配置。
# 阶段二：签完证书后的正式配置。
# 位置：/etc/nginx/sites-available/witguang
#
# 主域名是 www，裸域（apex）统一 301 过去。
# 证书覆盖两个名字：certbot --nginx -d witguang.com -d www.witguang.com
# 证书路径如果不同，按 /etc/letsencrypt/live/ 下实际的目录改。

# ── HTTP：全部跳到 HTTPS ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name witguang.com www.witguang.com;
    return 301 https://www.witguang.com$request_uri;
}

# ── 裸域 → www ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name witguang.com;

    ssl_certificate     /etc/letsencrypt/live/witguang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witguang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.witguang.com$request_uri;
}

# ── 主站 ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.witguang.com;

    ssl_certificate     /etc/letsencrypt/live/witguang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/witguang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 指向 releases 里的软链，部署脚本只切换这个软链
    root /var/www/witguang/current;
    index index.html;
    charset utf-8;

    # Astro 产物文件名带 hash，可以长期缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # HTML 不缓存，否则部署完看不到新内容
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
