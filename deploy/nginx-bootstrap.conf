# 手动配置用。如果你用 deploy/setup-vps.sh，这份文件不需要——脚本会自己生成配置。
# 阶段一：还没有证书时先用这份，先把站点跑通 HTTP。
# 位置：/etc/nginx/sites-available/witguang
#
#   ln -s /etc/nginx/sites-available/witguang /etc/nginx/sites-enabled/witguang
#   nginx -t && systemctl reload nginx
#
# 确认 http://www.witguang.com 能打开后，再跑 certbot 签证书，然后换成 ../nginx.conf。

server {
    listen 80;
    listen [::]:80;
    server_name witguang.com www.witguang.com;

    root /var/www/witguang/current;
    index index.html;
    charset utf-8;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpe?g|webp|avif|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
