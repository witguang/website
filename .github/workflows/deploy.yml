name: 构建并发布

# push 到 main 就自动：构建 → 推到 gh-pages → ssh 到 VPS 拉取。
# 也就是说，改完内容只要 git push，网站就更新了。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v5

      - name: 装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 装依赖
        run: npm ci

      - name: 构建
        env:
          # 会出现在 /version.json 里，用来核对线上是哪一次提交
          PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # 保留历史，服务器上才能 git reset 回滚
          force_orphan: false
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 让 VPS 拉取新版本
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # 这把钥匙在服务器上是受限的：只能执行 witguang-update
          ssh -o BatchMode=yes -o ConnectTimeout=20 root@43.128.75.128

      - name: 回读线上版本
        run: |
          sleep 3
          curl -fsS --max-time 20 https://www.witguang.com/version.json
